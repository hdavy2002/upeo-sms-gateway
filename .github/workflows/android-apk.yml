name: Companion Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      artifact:
        description: Artifact to build
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing release keystore secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks"
          } > android/key.properties
      - name: Build debug APK
        if: inputs.build_type == 'debug' && (inputs.artifact == 'apk' || inputs.artifact == 'both')
        run: flutter build apk --debug
      - name: Build release APK
        if: inputs.build_type == 'release' && (inputs.artifact == 'apk' || inputs.artifact == 'both')
        run: flutter build apk --release
      - name: Build release App Bundle
        if: inputs.build_type == 'release' && (inputs.artifact == 'aab' || inputs.artifact == 'both')
        run: flutter build appbundle --release
      - name: Upload APK
        if: inputs.artifact == 'apk' || inputs.artifact == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: avatok-sms-companion-${{ inputs.build_type }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Upload AAB
        if: inputs.build_type == 'release' && (inputs.artifact == 'aab' || inputs.artifact == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: avatok-sms-companion-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
